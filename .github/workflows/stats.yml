name: GitHub Stats

on:
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/stats.yml # regenerate when this workflow changes

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

env:
  # PAT (scopes: repo, read:user) so private contributions are counted
  STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
  STATS_OPTIONS: show_icons=true&hide_border=true&count_private=true&include_all_commits=true
  LANGS_OPTIONS: layout=compact&langs_count=8&hide_border=true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=dark_github&${{ env.STATS_OPTIONS }}
          path: assets/stats-dark.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=light_github&${{ env.STATS_OPTIONS }}
          path: assets/stats-light.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=dark_github&${{ env.LANGS_OPTIONS }}
          path: assets/top-langs-dark.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=light_github&${{ env.LANGS_OPTIONS }}
          path: assets/top-langs-light.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg assets/top-langs-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub stats cards"
          git pull --rebase
          git push
